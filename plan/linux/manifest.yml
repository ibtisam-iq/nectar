# Linux tool folder manifest.
# Read by scripts/gen-checklist.py and scripts/audit-tool.py.
# Any change to this file needs a matching entry in decisions.md (same commit).
#
# Fields
#   batch:     P (pilot, phase 2), A-I (phase 3 batches), "4" (phase 4), "5" (phase 5)
#   track:     Core | RHCSA | Advanced
#   weight:    High | Med | Low        (drives the line budget, see budgets below)
#   internals: true for (I) topics; each must have an L4 question and a link from round-4-internals.md
#   feeds:     module ids a scenario draws on

tool: linux
root: technical-grounding/linux
plan_version: 1
approved: 2026-09-15

tabs:
  - "RHEL / Rocky"
  - "Ubuntu / Debian"

budgets:            # max lines (min lines in brackets where it applies)
  topic:
    High: [250, 400]
    Med: [150, 300]
    Low: [60, 150]
  module_readme: 150
  scenario: 300
  lab: 400

top_level:
  - {file: README.md, type: tool-readme, batch: P}
  - {file: roadmap.md, type: roadmap, batch: P}

modules:
  - id: "00"
    dir: 00-foundations
    title: Foundations
    batch: A
    topics:
      - {file: what-is-linux.md, track: Core, weight: Low}
      - {file: kernel-vs-os-vs-distro.md, track: Core, weight: Med}
      - {file: distributions.md, track: Core, weight: Low}
      - {file: linux-vs-windows.md, track: Core, weight: Low}
      - {file: architecture.md, track: Core, weight: High}
      - {file: system-information.md, track: Core, weight: Med}

  - id: "01"
    dir: 01-shell-and-cli
    title: Shell and CLI
    batch: A
    absorbs: [STDOUT_STDERR_Guide.md]
    topics:
      - {file: shell-basics.md, track: Core, weight: Med}
      - {file: getting-help.md, track: Core, weight: Low}
      - {file: command-resolution.md, track: Core, weight: Med}
      - {file: variables-and-environment.md, track: Core, weight: High}
      - {file: locale-and-encoding.md, track: Core, weight: Low}
      - {file: quoting-and-expansion.md, track: Core, weight: Med}
      - {file: streams-and-redirection.md, track: Core, weight: High}
      - {file: exit-codes-and-chaining.md, track: Core, weight: High}
      - {file: text-editors.md, track: Core, weight: Low}
      - {file: scripting-essentials.md, track: RHCSA, weight: Med}

  - id: "02"
    dir: 02-files-and-filesystem
    title: Files and Filesystem
    batch: A
    absorbs: [tar-command.md]
    topics:
