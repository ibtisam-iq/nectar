      - {file: file-types.md, track: Core, weight: Med}
      - {file: navigation-and-listing.md, track: Core, weight: Low}
      - {file: file-operations.md, track: Core, weight: Med}
      - {file: inodes-and-links.md, track: Core, weight: High}
